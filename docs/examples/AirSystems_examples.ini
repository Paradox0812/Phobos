; Air systems examples for the PhobosFog P2 branch.
; These snippets are examples only. Merge them into a real rulesmd.ini with valid projectiles, warheads, reports, and art assets.

; Example 1: high-altitude intruder sight behavior.
[General]
AircraftAltitude.SightMultiplier.Ground=0.15
AircraftAltitude.SightMultiplier.Low=0.50
AircraftAltitude.SightMultiplier.Medium=1.00
AircraftAltitude.SightMultiplier.High=2.00

AircraftAltitude.DefaultAllowedAircraftAltitudes=Ground,Low,Medium

[ORCA]
AircraftAltitude=High

; Example 2: only a specific AA weapon can attack High.
[FlakWeaponHighTest]
Damage=40
ROF=20
Range=12
Projectile=FlakProj
Speed=100
Warhead=FlakWH
Report=FlakCannonAttack
Anim=GUNFIRE
AllowedAircraftAltitudes=High

[NAFLAK]
Primary=FlakWeaponHighTest

; Example 3: ordinary AA does not attack High.
[FlakGuyAAGun]
AllowedAircraftAltitudes=Ground,Low,Medium

; Example 4: non-Aircraft explicit opt-in.
[SomeFlyingInfantry]
AircraftAltitude=Low

; This target participates as Low in AircraftAltitude filtering.
; It does not automatically track JumpJet takeoff, landing, or airborne state.

; Example 5: DockedAircraftAutoAttack with TargetWeight.
[General]
DockedAircraftAutoAttack=true
DockedAircraftAutoAttack.Interval=15

[ORCA]
DockedAircraftAutoAttack=true
DockedAircraftAutoAttack.Range=18
DockedAircraftAutoAttack.MinAmmo=1
DockedAircraftAutoAttack.WeaponOrder=0,1
DockedAircraftAutoAttack.RequireVisibleTarget=true
DockedAircraftAutoAttack.TargetWeight.Vehicle=100
DockedAircraftAutoAttack.TargetWeight.Building=25

; Example 6: ReconCommand fields-only.
[AWACS]
ReconCommand.Enabled=true
ReconCommand.RequireDock=true
ReconCommand.LoiterFrames=450
ReconCommand.ReturnWhenDone=true
ReconCommand.Range=80
AircraftAltitude=High
Sight=12

; ReconCommand currently only has fields and a contract.
; It does not implement manual reconnaissance behavior yet.
